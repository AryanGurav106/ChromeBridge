[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "chromebridge"
version = "0.1.0"
description = "MCP stdio server that lets Claude Code drive your real Chrome window (your logins, your cookies, zero API keys) via a Chrome MV3 extension."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aryan Gurav" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "claude-code",
    "chrome",
    "chrome-extension",
    "browser-automation",
    "chrome-devtools-protocol",
    "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]

# Single source of truth is requirements.txt -- do not restate the pins here.
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/AryanGurav106/ChromeBridge"
Source = "https://github.com/AryanGurav106/ChromeBridge"
Issues = "https://github.com/AryanGurav106/ChromeBridge/issues"

[project.scripts]
# Same call the `if __name__ == "__main__"` block in mcp_server.py makes:
# `mcp` is the module-level FastMCP instance, `.run()` starts the stdio transport.
chromebridge = "mcp_server:mcp.run"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Flat layout: two top-level modules plus the `core` package. Everything else at
# the repo root (extension/, tools/, legacy/, temp/, secrets/) is deliberately
# NOT packaged -- the extension is loaded unpacked in Chrome, not pip-installed.
[tool.setuptools]
py-modules = ["mcp_server", "config"]

[tool.setuptools.packages.find]
include = ["core*"]
namespaces = false
